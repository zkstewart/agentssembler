# Replays the 13Q010 triploid build. --saved is its unitig_assembly directory. Its 06_chains predates a build_chains.py fix, so it is seeded (see docs/TESTING.md).
config:
  sample: 13Q010
  chromosomes: 9
  ploidy: 3
  inputs:
    unitigs_fasta: 00_inputs/unitigs.fasta
    unitigs_gfa: 00_inputs/unitigs.gfa
    corrected_reads: 00_inputs/ont_corrected_reads.fasta
    hic_r1: 00_inputs/hic_R1.fq.gz
    hic_r2: 00_inputs/hic_R2.fq.gz
    reference: 00_inputs/reference.fasta
    raw_bams: [../nanopore/glauca_shearing_Pete_13Q010_27_11_2024.sup.bam]
  settings: {hap_first: false, restore_connectors: false, hops: 8}
  tools:
    minimap2: /home/stewarz2/bio/minimap2-2.31/minimap2
    samtools: /home/stewarz2/anaconda3/envs/assembly/bin/samtools
    seqkit: /home/stewarz2/anaconda3/envs/assembly/bin/seqkit
    bwa: /home/stewarz2/bio/bwa/bwa
    samblaster: /home/stewarz2/anaconda3/envs/assembly/bin/samblaster
    filter_bam: /home/stewarz2/bio/HapHiC/utils/filter_bam
    plot_python: /home/stewarz2/anaconda3/envs/haphic/bin/python
    juicer_tools: /home/stewarz2/bio/HapHiC/utils/juicer_tools.1.9.9_jcuda.0.8.jar
  compute: {min_free_gb: 40, guard_path: /mnt/d}
seed:
  02_ont_map/ont_vs_unitigs.paf.gz: 02_ont_map/ont_vs_unitigs.paf.gz
  03_unitig_align/unitigs_self.paf.gz: 03_unitig_align/unitigs_self.paf.gz
  03_unitig_align/unitigs_vs_ref.paf.gz: 03_unitig_align/unitigs_vs_ref.paf.gz
  06_chains/chains.agp: 06_chains/chains.agp
  06_chains/chains.fasta: 06_chains/chains.fasta
  06_chains/chains.fasta.fai: 06_chains/chains.fasta.fai
  06_chains/chains_self.paf.gz: 06_chains/chains_self.paf.gz
  06_chains/ont_vs_chains.paf.gz: 06_chains/ont_vs_chains.paf.gz
  07_chains2/ont_vs_chains.paf.gz: 07_chains2/ont_vs_chains.paf.gz
  09_hic_map/pairs.tsv.gz: 09_hic_map/pairs.tsv.gz
  11_ont_chains/ont_vs_chains.paf.gz: 11_ont_chains/ont_vs_chains.paf.gz
  14_readfill/ont_vs_target.paf.gz: 14_readfill/ont_vs_target.paf.gz
  17_raw_reads/raw_vs_target.paf.gz: 17_raw_reads/raw_vs_target.paf.gz
  17_raw_reads/reads.tsv.gz: 17_raw_reads/reads.tsv.gz
  17_raw_reads/corrected.lens.tsv.gz: 17_raw_reads/corrected.lens.tsv.gz
  17_raw_reads/neargap.fasta: 17_raw_reads/neargap.fasta
  17_raw_reads/fill/raw.paf.gz: 17_raw_reads/v2/raw.paf.gz
  17_raw_reads/fill/audit.paf.gz: 17_raw_reads/v2/audit.paf.gz
edits:
  chain_breaks.txt: 12_broken/breaks.txt
  names.tsv: 13_scaffold/names.tsv
edits_text:
  group_edits.tsv: "chain0221\tgroup\tg16\ttelomere tip via chain0139+\n"
  order_links.tsv: "chain0139+\tchain0221-\ttelomere_tip\tD07\nchain0129+\tchain0081+\tcurated\tD10\n"
  join_decisions.tsv: "chr2_h3\tutg000458l\tutg000028l\tonly 12.9 kb of the 29.7 kb trim matches the kept flank, at 89.8%\n"
decisions:
  D01: {hap_depth: 27, repeat_depth: 120, collapsed: false}
compare:
