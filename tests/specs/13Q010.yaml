  - [07_chains2/kept2.txt, 07_chains2/kept2.txt]
  - [07_chains2/chains.agp, 07_chains2/chains.agp, sorted]
  - [07_chains2/joins.verify.tsv, 07_chains2/joins.verify.tsv]
