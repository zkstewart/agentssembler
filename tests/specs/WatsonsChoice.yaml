    minimap2: /home/stewarz2/bio/minimap2-2.31/minimap2
    samtools: /home/stewarz2/anaconda3/envs/assembly/bin/samtools
    seqkit: /home/stewarz2/anaconda3/envs/assembly/bin/seqkit
