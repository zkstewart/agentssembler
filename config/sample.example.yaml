# Copy this, fill it in, and give it to `agentssembler init`. Relative paths resolve from the directory where you run `init`,
# and keep resolving from there on every later command. Absolute paths are safer if anything may move.
sample: MySample        # used in file names
chromosomes: 9          # haploid number
ploidy: 2               # haplotypes that are distinct alleles of each other. Not always the textbook ploidy: an allotetraploid is
                        # 2 with the whole haploid number above, and an inbred line is 1. See docs/SETTINGS.md.

inputs:
  unitigs_fasta: /data/sample/p_utg.fasta     # hifiasm unitigs
  unitigs_gfa: /data/sample/p_utg.gfa         # the same unitigs, with graph links
  corrected_reads: /data/sample/corrected.fasta # FASTA or FASTQ, gzipped or not
  hic_r1: /data/sample/hic_R1.fq.gz
  hic_r2: /data/sample/hic_R2.fq.gz
  # Optional. Names chromosomes and raises alarms. Never places sequence.
  reference: /data/related/reference.fasta
  # Optional. Reads an earlier assembly's AGP into the group alarm table.
  # baseline_agp: /data/sample/earlier.agp
  # Optional. Raw basecalled reads: BAM or CRAM (unaligned or aligned), or FASTQ or FASTA, gzipped or not.
  # Turns on stages 13 and 14. raw_bams, the earlier name, is still read.
  raw_reads: []

# hap_depth, repeat_depth and collapsed are set at decision D01. See docs/SETTINGS.md.
settings:
  telomere_motif: CCCTAAA
  # hap_first: true     # defaults to true at ploidy 2
  # length_scale: 1     # measured from the chains when left out; 1 fixes the citrus windows
  # min_within: 700     # measured as 0.13 x the library's Hi-C density when left out; 700 fixes the citrus value
  # read_preset: lr:hq  # minimap2 preset for corrected_reads; map-hifi for HiFi reads in FASTA
  # raw_preset: lr:hq   # minimap2 preset for raw_reads
  # hic_allele_rescue: false  # decide at D04 from 09_hic_map/rescue_signal.txt: place chains Hi-C cannot (near-identical haplotypes)
  # raw_phase_early: false   # with raw reads: raw-read arm phase at stage 10, before D15 (a raw mapping, ~2.5 h on 292)
  # reference_dotplot: true  # with a reference: final_vs_ref.paf at stage 15 for a dot plot
  # unloc_purge: 0.2    # unlocalized scaffolds (stage 15): drop the shorter of two same-haplotype chains overlapping by this fraction

# Full paths, or names on PATH. juicer_tools, compleasm and plot_python are optional; steps using them are skipped when unset.
tools:
  minimap2: minimap2
  samtools: samtools
  seqkit: seqkit
  bwa: bwa
  samblaster: samblaster
  juicer_tools: /path/to/HapHiC/utils/juicer_tools.1.9.9_jcuda.0.8.jar
  compleasm: /path/to/envs/compleasm/bin/compleasm
  plot_python: python3    # a Python with matplotlib

# compleasm is optional, but with it stage 01 maps genes on the unitigs and D04, D05, D16 can count genes each choice gains.
compleasm:
  library: /path/to/mb_downloads
  lineage: eudicotyledons_odb12
  # min_complete: 95     # validation alarm when a haplotype is less complete than this (%)

compute:
  threads: 16
  min_free_gb: 40
  guard_path: .           # the drive that fills first. Under WSL, the host drive, such as /mnt/d
